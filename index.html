  .kraft { height: 7px; margin-top: 4px; border-radius: 4px; background: rgba(20,10,4,.7); overflow: hidden; position: relative; width: 78%; }

  #messung { font-size: 11px; font-weight: 700; margin-top: 4px; color: #b8f0a0; text-shadow: 0 1px 3px #000; white-space: nowrap; }
  #banner { position: fixed; left: 0; right: 0; top: 30%; text-align: center; font-size: 44px; font-weight: 900; letter-spacing: .02em;
    text-shadow: 0 4px 18px rgba(0,0,0,.8), 0 0 30px rgba(255,190,90,.6); opacity: 0; transform: scale(.7); transition: opacity .2s, transform .25s; pointer-events: none; }

    pointer-events: none; animation: zahl .7s ease-out forwards; }

  .kn small { font-size: 10px; font-weight: 700; opacity: .9; } .kn span { font-size: 30px; line-height: 1; }

  #kAngriff { right: 0; bottom: 0; width: 104px; height: 104px; } #kAngriff span { font-size: 42px; }

  #dorf.an { display: block; }
  #dorf::before { content: ''; position: absolute; inset: -30px; background: url(bilder/dorf.webp) center / cover; filter: blur(16px) brightness(.5); }
  #land { position: absolute; left: 0; right: 0; top: calc(54px + env(safe-area-inset-top)); bottom: calc(116px + env(safe-area-inset-bottom)); container-type: size; }
  #dorfKarte { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(100cqw, 100cqh * 687 / 1024); aspect-ratio: 687 / 1024; container-type: inline-size; }
  #dorfBild { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }

  .rs { background: rgba(30,18,8,.78); border-radius: 999px; padding: 6px 10px; font-weight: 800; font-size: 14px; white-space: nowrap; box-shadow: inset 0 0 0 1.5px rgba(255,210,122,.3); }
  /* Platz-Mitte = Mitte des Sockels: Knopf beginnt am Punkt und wird um den halben Sockel nach oben geschoben */
  .platz { position: absolute; transform: translate(-50%, -9cqw); width: 32cqw; border: 0; background: none; color: #fff; font: inherit; padding: 0; text-align: center; z-index: 1; }

    background: radial-gradient(circle at 50% 40%, #b48a5a, #7a5530); box-shadow: 0 6px 10px rgba(0,0,0,.4), inset 0 0 0 3px rgba(255,226,170,.85); }
  .platz.leer .sockel { background: rgba(255,240,210,.12); box-shadow: inset 0 0 0 2px rgba(255,240,210,.55); }
  .platz.leer .sockel span, .platz.bald .sockel span { opacity: .55; filter: grayscale(.7); }

  .platz.kann .sockel { animation: winke 0.9s infinite alternate; }
  @keyframes winke { to { box-shadow: 0 0 18px 4px rgba(255,214,120,.95), inset 0 0 0 3px #fff3c4; } }
  .platz .schild { display: inline-block; margin-top: 2px; padding: 2px 8px; border-radius: 8px; font-size: 12px; font-weight: 800; background: rgba(30,18,8,.82); }
  .platz .sterne { display: block; font-size: 12px; color: #ffd27a; letter-spacing: 2px; text-shadow: 0 1px 3px #000; height: 15px; }
  #dorfUnten { position: absolute; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom)); text-align: center; z-index: 2; }
  #dorfUnten .gross { padding: 15px 46px; font-size: 20px; }

  #bauIcon { font-size: 56px; line-height: 1.1; }
  /* Missionen */
  .karte.breit { max-width: 400px; padding: 16px 12px 12px; }
  #mListe { max-height: 52vh; overflow-y: auto; touch-action: pan-y; text-align: left; margin: 0 -2px 8px; }
  .mis { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; border-radius: 14px; padding: 9px 10px; margin: 0 0 7px; font: inherit; color: #f3e3cc; background: #47301e; text-align: left; }
  .mis .nr { flex: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; background: #2e1e10; }
  .mis b { display: block; font-size: 15px; } .mis small { display: block; font-size: 12px; opacity: .85; margin-top: 1px; }

<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as kloneSkelett } from 'three/addons/utils/SkeletonUtils.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

/* =====================================================================
   Arena: Echtzeit-Kampf von schräg oben, gegen den Computer.
   Zwischen SIM-START und SIM-END steht die reine Spiellogik: fester Zeitschritt, nur Seed-Zufall,
   kein DOM, kein Date, kein Math.random(). Gleicher Seed ⇒ gleicher Kampf (tests/sim.test.js liest
   genau diesen Block). Alles danach ist Darstellung und Bedienung. Zugriff für Tests: window.AR
   ===================================================================== */

/* SIM-START */
const DT = 1 / 60;
// Alle Stellschrauben des Kampfes an einer Stelle
const K = {
  ARENA_R: 6, KOERPER: 0.42,
  SCHLAG_ZEIT: [0.34, 0.34, 0.5],   // Dauer der drei Schläge einer Folge
  TREFFER_BEI: 0.15,                // Sekunden nach Schlagbeginn sitzt der Treffer
  RUECK: [3, 3, 8.5],               // Rückstoß je Schlag
  TAUMEL: [0.24, 0.24, 0.42],       // so lange kann der Getroffene nichts tun
  WINKEL: 0.45,                     // Treffer-Kegel nach vorn (Kosinus des halben Winkels)
  ROLLE_ZEIT: 0.36, ROLLE_TEMPO: 9.5, ROLLE_PAUSE: 0.85,
  SPEZIAL_DAUER: 5, E_AUSTEILEN: 12, E_EINSTECKEN: 9,
  SCHUTZ: 0.55,                     // nach dem dritten Schlag einer Folge ist der Getroffene kurz unverwundbar
  STEIN: 1.3, STURM: 1.4,           // Schaden-Faktor während der Verwandlung
  STEIN_TEMPO: 0.8, STURM_TEMPO: 1.4, STURM_SCHLAG: 0.68, // der Drachenpanzer ist langsam, der Sturm schnell
  RUNDE_ZEIT: 60, WELLE_ZEIT: 120, DREH: 16, ZIELHILFE: 3.2,
  ZAEHLEN: 2.4, PAUSE: 2.0, SIEGE: 2, HEILUNG: 25,
};
// Kämpfer-Werte. flink < 1 = schnellere Schläge. spezial (Verwandlung, in der man nicht taumelt):
// 'stein' (Drachenpanzer) = größer, mehr Reichweite, langsam, kaum wegzustoßen; 'sturm' = schnell, trifft im Halbkreis
const TYPEN = {
  junge:    { name: 'Junge',    leben: 100, tempo: 4.5, schaden: [6, 6, 10],   reichweite: 1.5,  spezial: 'stein' },
  maedchen: { name: 'Mädchen',  leben: 92,  tempo: 5.0, schaden: [6, 6, 9],    reichweite: 1.5,  spezial: 'sturm', flink: 0.85 },
  ritter:   { name: 'Rabenritter', leben: 100, tempo: 4.3, schaden: [6, 6, 10], reichweite: 1.55, spezial: 'stein' },
  scherge:  { name: 'Scherge',  leben: 30,  tempo: 3.7, schaden: [4, 4, 6],    reichweite: 1.35, spezial: null },
  boss:     { name: 'Hauptmann', leben: 140, tempo: 3.9, schaden: [8, 8, 13], reichweite: 1.75, spezial: 'stein' },
};
const WELLEN = [['scherge', 'scherge'], ['scherge', 'scherge', 'scherge'], ['boss']];
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// Eine Runde. Eingaben je Kämpfer: mx, mz (Laufrichtung, Länge bis 1) und wunsch.angriff / .rolle / .spezial.
// Richtung r: Blick zeigt nach (sin r, cos r). Team 0 startet unten (z > 0), Team 1 oben.
class Kampf {
  constructor(seed, liste, opt = {}) {
    this.rnd = mulberry32(seed); this.zeit = 0; this.limit = opt.limit ?? K.RUNDE_ZEIT; this.ereignisse = []; this.fertig = false; this.sieger = -1;
    const zahl = [0, 0], von = [liste.filter(e => e.team === 0).length, liste.filter(e => e.team === 1).length];
    this.k = liste.map((e, i) => { const t = TYPEN[e.typ], j = zahl[e.team]++, n = von[e.team];
      return { i, typ: e.typ, team: e.team, x: (j - (n - 1) / 2) * 2.2, z: e.team === 0 ? 3.2 : -3.2, r: e.team === 0 ? Math.PI : 0, sx: 0, sz: 0,
        leben: e.leben ?? t.leben + (e.bonus?.leben ?? 0), maxLeben: t.leben + (e.bonus?.leben ?? 0), energie: e.energie ?? 0, sf: e.bonus?.schaden ?? 1, ef: e.bonus?.energie ?? 1, zustand: 'frei', t: 0, kette: 0, traf: false, puffer: false, schlagNr: 0,
        rollePause: 0, schutz: 0, rx: 0, rz: 0, spezial: 0, mx: 0, mz: 0, wunsch: { angriff: false, rolle: false, spezial: false } }; });
  }
  lebend(team) { return this.k.filter(f => f.team === team && f.zustand !== 'tot'); }
  step() {
    this.ereignisse.length = 0; if (this.fertig) return; this.zeit += DT;
    for (const f of this.k) if (f.zustand !== 'tot') this.bewege(f);
    // Körper schieben sich auseinander (wer rollt, schlüpft durch)
    for (let a = 0; a < this.k.length; a++) for (let b = a + 1; b < this.k.length; b++) { const p = this.k[a], q = this.k[b];
      if (p.zustand === 'tot' || q.zustand === 'tot' || p.zustand === 'rolle' || q.zustand === 'rolle') continue;
      const dx = q.x - p.x, dz = q.z - p.z, d = Math.hypot(dx, dz), m = 2 * K.KOERPER;
      if (d < m) { const nx = d > 1e-4 ? dx / d : 1, nz = d > 1e-4 ? dz / d : 0, h = (m - d) / 2; p.x -= nx * h; p.z -= nz * h; q.x += nx * h; q.z += nz * h; } }
    for (const f of this.k) { const d = Math.hypot(f.x, f.z), max = K.ARENA_R - K.KOERPER; if (d > max) { f.x *= max / d; f.z *= max / d; f.sx *= 0.3; f.sz *= 0.3; } }
    const a = this.lebend(0).length, b = this.lebend(1).length;
    if (a === 0 || b === 0) { this.fertig = true; this.sieger = a > 0 ? 0 : b > 0 ? 1 : -1; }
    else if (this.zeit >= this.limit) { this.fertig = true; const teil = t => this.k.filter(f => f.team === t).reduce((s, f) => s + Math.max(0, f.leben) / f.maxLeben, 0) / this.k.filter(f => f.team === t).length;
      const u = teil(0), v = teil(1); this.sieger = Math.abs(u - v) < 0.01 ? -1 : u > v ? 0 : 1; this.ereignisse.push({ art: 'zeit' }); }
  }
  bewege(f) {
    const t = TYPEN[f.typ], w = f.wunsch;
    if (f.rollePause > 0) f.rollePause -= DT; if (f.schutz > 0) f.schutz -= DT;
    if (f.spezial > 0) { f.spezial -= DT; if (f.spezial <= 0) { f.spezial = 0; this.ereignisse.push({ art: 'spezialEnde', von: f.i }); } }
    const sturm = f.spezial > 0 && t.spezial === 'sturm', stein = f.spezial > 0 && t.spezial === 'stein';
    f.x += f.sx * DT; f.z += f.sz * DT; const ab = Math.exp(-DT * 9); f.sx *= ab; f.sz *= ab;   // Rückstoß klingt ab
    const ml = Math.hypot(f.mx, f.mz), ex = ml > 1 ? f.mx / ml : f.mx, ez = ml > 1 ? f.mz / ml : f.mz;
    if (f.zustand === 'taumel') { w.angriff = w.rolle = false; f.t -= DT; if (f.t <= 0) f.zustand = 'frei'; return; }
    if (f.zustand === 'rolle') { f.x += f.rx * K.ROLLE_TEMPO * DT; f.z += f.rz * K.ROLLE_TEMPO * DT; f.t -= DT; if (f.t <= 0) { f.zustand = 'frei'; f.rollePause = K.ROLLE_PAUSE; } return; }
    if (f.zustand === 'schlag') {

    if (ml > 0.1) { let d = Math.atan2(ex, ez) - f.r; d = Math.atan2(Math.sin(d), Math.cos(d)); f.r += Math.max(-K.DREH * DT, Math.min(K.DREH * DT, d)); }

}

// Computer-Gegner, Stufe 1 bis 10. Mit k = (Stufe − 1) / 9 steigen Reaktion, Angriffslust, Ausweichen und Folgen.
class Bot {
  constructor(stufe, seed) { this.stufe = Math.max(1, Math.min(10, stufe)); this.k = (2 + (this.stufe - 1) * 7 / 9) / 9; /* Stufe 1 entspricht der früheren Stufe 3 */ this.rnd = mulberry32(seed); this.warte = 0; this.gesehen = {}; this.kette = -1; this.seite = 1; }
  denke(kampf, i) {
    const f = kampf.k[i], k = this.k, t = TYPEN[f.typ]; if (f.zustand === 'tot') return;
    let ziel = null, zd = 1e9; for (const g of kampf.k) { if (g.team === f.team || g.zustand === 'tot') continue; const d = Math.hypot(g.x - f.x, g.z - f.z); if (d < zd) { zd = d; ziel = g; } }
    if (!ziel) { f.mx = f.mz = 0; return; }
    const dx = (ziel.x - f.x) / (zd || 1), dz = (ziel.z - f.z) / (zd || 1);
    // Ausweichen: einmal je gegnerischem Schlag gewürfelt, sobald er in Reichweite ausholt
    for (const g of kampf.k) { if (g.team === f.team || g.zustand !== 'schlag' || g.traf || this.gesehen[g.i] === g.schlagNr) continue;
      if (Math.hypot(g.x - f.x, g.z - f.z) < TYPEN[g.typ].reichweite + 1) { this.gesehen[g.i] = g.schlagNr;
        if (f.rollePause <= 0 && this.rnd() < 0.03 + 0.42 * k) { f.wunsch.rolle = true; f.mx = -dz * this.seite; f.mz = dx * this.seite; this.warte = 8; return; } } }
    // Schlagfolge fortsetzen: einmal je eigenem Schlag gewürfelt
    if (f.zustand === 'schlag' && this.kette !== f.schlagNr && f.t > 0.1) { this.kette = f.schlagNr; if (f.kette < 2 && this.rnd() < 0.35 + 0.5 * k) f.wunsch.angriff = true; }
    if (--this.warte > 0) return;
    this.warte = Math.round(20 - 11 * k + this.rnd() * 4);
    if (this.rnd() < 0.3) this.seite = -this.seite;
    if (this.rnd() < 0.2 * (1 - k)) { f.mx = f.mz = 0; return; }                               // zögern
    if (f.energie >= 100 && t.spezial && zd < 4 && this.rnd() < 0.25 + 0.75 * k) f.wunsch.spezial = true;
    const nah = t.reichweite * 0.9;
    if (zd > nah) { const s = (this.rnd() - 0.5) * 0.7; f.mx = dx - dz * s; f.mz = dz + dx * s; }
    else if (f.zustand === 'frei' && this.rnd() < 0.36 + 0.4 * k) { f.mx = dx * 0.15; f.mz = dz * 0.15; f.wunsch.angriff = true; }
    else { f.mx = -dz * this.seite * 0.35; f.mz = dx * this.seite * 0.35; }
  }
}

// Ein ganzes Duell oder ein Wellen-Lauf. Phasen: count → play → end → (count …) → over.
// opt: { modus: 'duell' | 'wellen', spieler, gegner, stufe, seed, mensch (false = auch der Spieler ist ein Bot), spielerStufe }
class Match {
  constructor(opt) {
    this.opt = { modus: 'duell', spieler: 'junge', gegner: 'ritter', stufe: 1, seed: 1, mensch: true, spielerStufe: 5, ...opt };
    this.rnd = mulberry32(this.opt.seed); this.punkte = [0, 0]; this.runde = 0; this.welle = 0; this.gewonnen = null; this.ereignisse = [];
    this.tragen = null; this.neueRunde();
  }
  neueRunde() {
    const o = this.opt, seed = Math.floor(this.rnd() * 2 ** 31); let liste, limit = K.RUNDE_ZEIT;
    if (o.modus === 'wellen') { liste = [{ typ: o.spieler, team: 0, bonus: o.bonus, ...(this.tragen ?? {}) }, ...WELLEN[this.welle].map(typ => ({ typ, team: 1 }))]; limit = K.WELLE_ZEIT; }
    else liste = [{ typ: o.spieler, team: 0, bonus: o.bonus }, { typ: o.gegner, team: 1 }];
    this.kampf = new Kampf(seed, liste, { limit }); this.phase = 'count'; this.t = this.runde === 0 && this.welle === 0 ? K.ZAEHLEN : K.ZAEHLEN * 0.7;
    this.bots = this.kampf.k.map((f, i) => i === 0 ? (o.mensch ? null : new Bot(o.spielerStufe, seed + 7)) : new Bot(f.typ === 'scherge' ? Math.max(1, o.stufe - 2) : o.stufe, seed + 13 * (i + 1)));
  }
  tick() {
    this.ereignisse.length = 0;
    if (this.phase === 'count') { this.t -= DT; if (this.t <= 0) { this.phase = 'play'; this.ereignisse.push({ art: 'los' }); } return; }
    if (this.phase === 'play') {
      this.bots.forEach((b, i) => b && b.denke(this.kampf, i)); this.kampf.step(); for (const e of this.kampf.ereignisse) this.ereignisse.push(e);
      if (this.kampf.fertig) { const s = this.kampf.sieger, o = this.opt; this.phase = 'end'; this.t = K.PAUSE;
        if (o.modus === 'wellen') { if (s === 0) { this.welle++; const ich = this.kampf.k[0]; this.tragen = { leben: Math.min(ich.maxLeben, ich.leben + K.HEILUNG), energie: ich.energie }; } else this.gewonnen = false;
          if (this.welle >= WELLEN.length) this.gewonnen = true; }
        else { this.runde++; if (s >= 0) this.punkte[s]++; if (this.punkte[0] >= K.SIEGE) this.gewonnen = true; else if (this.punkte[1] >= K.SIEGE) this.gewonnen = false;
          else if (this.runde >= 5) this.gewonnen = this.punkte[0] > this.punkte[1]; }
        this.ereignisse.push({ art: 'rundeEnde', sieger: s }); }
      return;
    }
    if (this.phase === 'end') { this.t -= DT; if (this.t <= 0) { if (this.gewonnen !== null) { this.phase = 'over'; this.ereignisse.push({ art: 'ende', gewonnen: this.gewonnen }); } else this.neueRunde(); } }
  }
}

    const art = m.modus === 'wellen' ? 'Wellen' : `Duell gegen ${TYPEN[m.gegner].name}`;
    b.innerHTML = `<span class="nr">${fertig ? '✓' : zu ? '🔒' : i + 1}</span><span><b>${m.name}</b><small>${zu ? 'Erst die Mission davor schaffen.' : m.text}</small>`
      + `<small>${art} · Stufe ${m.stufe} · ${ROHSTOFFE.filter(r => m.lohn[r]).map(r => `${ROH_BILD[r]}${fertig ? Math.round(m.lohn[r] / 2) : m.lohn[r]}`).join(' ')}${m.figur && !dorf.figuren.includes(m.figur) ? ' · ✨ neue Figur' : ''}</small></span>`;
    b.addEventListener('click', () => starteMission(i)); l.appendChild(b); });
  $('missionen').classList.add('an'); const ziel = l.querySelector('.neu'); if (ziel) l.scrollTop = ziel.offsetTop - l.offsetTop - 60;
}
function zeigeDorf() { app.läuft = false; app.imDorf = true; allesLos(); for (const id of ['ergebnis', 'missionen', 'bau']) $(id).classList.remove('an');
  $('anzeige').style.display = 'none'; $('knöpfe').style.display = 'none'; zeichneDorf(); $('dorf').classList.add('an'); }
$('zuMissionen').addEventListener('click', zeigeMissionen); $('mZu').addEventListener('click', () => $('missionen').classList.remove('an'));
$('bauZu').addEventListener('click', () => $('bau').classList.remove('an'));
$('sTon').addEventListener('click', () => { stand.ton = !stand.ton; speicher.schreib('ton', stand.ton ? '1' : '0'); zeichneDorf(); });
$('sVib').addEventListener('click', () => { stand.vib = !stand.vib; speicher.schreib('vib', stand.vib ? '1' : '0'); zeichneDorf(); });
$('nochmal').addEventListener('click', () => starte(app.letzte.opt, app.letzte.mission)); $('zumMenü').addEventListener('click', zeigeDorf);

// ---------- Hauptschleife ----------
const uhr = new THREE.Clock();
function passeAn() { renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = innerHeight > innerWidth ? 40 : 46; camera.updateProjectionMatrix(); }
window.addEventListener('resize', passeAn);
// Mess-Anzeige für Figuren-Tests (?figur=): Ladezeit und Bilder pro Sekunde
const messung = { an: Q.has('figur'), laden: 0, bilder: 0, seit: performance.now(), bps: 0 };
function messe() { if (!messung.an) return; messung.bilder++; const jetzt = performance.now();
  if (jetzt - messung.seit >= 1000) { messung.bps = Math.round(messung.bilder * 1000 / (jetzt - messung.seit)); messung.bilder = 0; messung.seit = jetzt;
    $('messung').textContent = `Laden ${(messung.laden / 1000).toFixed(1)} s · ${messung.bps} Bilder/s`; } }
function bild() {
  requestAnimationFrame(bild); messe(); const echt = Math.min(0.05, uhr.getDelta()); zeit += echt; if (app.imDorf) return;   // Dorf ist reines Bild, Kampfszene ruht
  let dt = echt; if (zeitlupe > 0) { zeitlupe -= echt; dt *= 0.3; } if (stopp > 0) { stopp -= echt; dt = 0; }      // Treffer-Stopp und Zeitlupe sind nur Darstellung
  const m = app.match;
  if (m && m.phase !== 'over') { app.rest += dt * app.tempo; let n = 0;
    while (app.rest >= DT && n++ < 40) { app.rest -= DT; if (m.phase === 'play') leseEingabe(); for (const f of m.kampf.k) { f.vx0 = f.x; f.vz0 = f.z; } m.tick(); for (const e of m.ereignisse) fx(e); if (stopp > 0 || m.phase === 'over') break; } }
  if (m) { const k = m.kampf; if (k !== app.kampfAlt) { for (const f of app.figuren) scene.remove(f.grp); app.figuren = k.k.map(baueFigur); app.kampfAlt = k; }
    const anteil = klemme(app.rest / DT, 0, 1); k.k.forEach((f, i) => zeigeFigur(app.figuren[i], f, dt, anteil)); zeigeAnzeige(); }
  bewegeTeile(dt); for (const f of feuer) { f.scale.setScalar(1.5 + 0.25 * Math.sin(zeit * 9 + f.userData.ph) + 0.15 * Math.sin(zeit * 23 + f.userData.ph)); }
  bewegeKamera(echt, false); renderer.render(scene, camera);
}

async function init() {
  passeAn(); baueArena(); zeichneDorf(); await ladeVorlagen();
  bewegeKamera(0, true); renderer.compile(scene, camera); requestAnimationFrame(bild);
  $('meldung').textContent = fehlend.length ? 'Figuren nicht geladen, es geht mit Ersatzfiguren weiter.' : 'Die Figuren sind Platzhalter, bis deine eigenen da sind.'; $('zuMissionen').disabled = false;
  messung.laden = performance.now(); AR.bereit = true; if (Q.has('start')) starte({ ...(Q.get('modus') ? { modus: Q.get('modus') } : {}), ...(Q.get('stufe') ? { stufe: +Q.get('stufe') } : {}), ...(Q.get('seed') ? { seed: +Q.get('seed') } : {}), ...(Q.get('spielerStufe') ? { spielerStufe: +Q.get('spielerStufe') } : {}) });
}
const AR = window.AR = { bereit: false, messung, K, TYPEN, WELLEN, Kampf, Bot, Match, app, stand, eingabe, fehlend, starte, zeigeDorf, dorf, GEBAEUDE, MISSIONEN, baue, starteMission, zeigeMissionen,
  info: () => { const m = app.match, k = m.kampf, ich = k.k[0], g = k.k.filter(f => f.team === 1);
    return { läuft: app.läuft, phase: m.phase, modus: m.opt.modus, punkte: [...m.punkte], welle: m.welle, gewonnen: m.gewonnen, zeit: k.zeit,
      ich: { x: ich.x, z: ich.z, leben: ich.leben, energie: ich.energie, zustand: ich.zustand, spezial: ich.spezial, kette: ich.kette }, gegner: g.map(f => ({ x: f.x, z: f.z, leben: f.leben, zustand: f.zustand })) }; } };
init().catch(e => { console.error(e); $('meldung').textContent = 'Fehler beim Start: ' + e.message; });
</script>
</body>
