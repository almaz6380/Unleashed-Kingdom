<style>

  #banner small { display: block; font-size: 17px; font-weight: 600; margin-top: 4px; }
  .zahl { position: fixed; left: 0; top: 0; font-size: 22px; font-weight: 900; color: #fff3c4; text-shadow: 0 2px 4px #000, 0 0 8px rgba(255,120,40,.9);

  .zahl.gross { font-size: 32px; color: #ffd27a; } .zahl.ich { color: #ff8a7a; }

  #kreis { width: 116px; height: 116px; border: 2px solid rgba(255,255,255,.5); background: rgba(255,255,255,.07); }

<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as kloneSkelett } from 'three/addons/utils/SkeletonUtils.js';

/* =====================================================================
   Arena: Echtzeit-Kampf von schräg oben, gegen den Computer.
   Zwischen SIM-START und SIM-END steht die reine Spiellogik: fester Zeitschritt, nur Seed-Zufall,
   kein DOM, kein Date, kein Math.random(). Gleicher Seed ⇒ gleicher Kampf (tests/sim.test.js liest
   genau diesen Block). Alles danach ist Darstellung und Bedienung. Zugriff für Tests: window.AR
   ===================================================================== */

/* SIM-START */
const DT = 1 / 60;
// Alle Stellschrauben des Kampfes an einer Stelle
const K = {
  ARENA_R: 6, KOERPER: 0.42,
  SCHLAG_ZEIT: [0.34, 0.34, 0.5],   // Dauer der drei Schläge einer Folge
  TREFFER_BEI: 0.15,                // Sekunden nach Schlagbeginn sitzt der Treffer
  RUECK: [3, 3, 8.5],               // Rückstoß je Schlag
  TAUMEL: [0.24, 0.24, 0.42],       // so lange kann der Getroffene nichts tun
  WINKEL: 0.45,                     // Treffer-Kegel nach vorn (Kosinus des halben Winkels)
  ROLLE_ZEIT: 0.36, ROLLE_TEMPO: 9.5, ROLLE_PAUSE: 0.85,
  SPEZIAL_DAUER: 5, E_AUSTEILEN: 12, E_EINSTECKEN: 9,
  SCHUTZ: 0.55,                     // nach dem dritten Schlag einer Folge ist der Getroffene kurz unverwundbar
  STEIN: 1.3, STURM: 1.4,           // Schaden-Faktor während der Verwandlung
  STEIN_TEMPO: 0.8, STURM_TEMPO: 1.4, STURM_SCHLAG: 0.68, // der Steinriese ist langsam, der Sturm schnell
  RUNDE_ZEIT: 60, WELLE_ZEIT: 120, DREH: 16, ZIELHILFE: 3.2,
  ZAEHLEN: 2.4, PAUSE: 2.0, SIEGE: 2, HEILUNG: 25,
};
// Kämpfer-Werte. flink < 1 = schnellere Schläge. spezial (Verwandlung, in der man nicht taumelt):
// 'stein' = größer, mehr Reichweite, langsam, kaum wegzustoßen; 'sturm' = schnell, trifft im Halbkreis
const TYPEN = {
  junge:    { name: 'Junge',    leben: 100, tempo: 4.5, schaden: [6, 6, 10],   reichweite: 1.5,  spezial: 'stein' },
  maedchen: { name: 'Mädchen',  leben: 92,  tempo: 5.0, schaden: [6, 6, 9],    reichweite: 1.5,  spezial: 'sturm', flink: 0.85 },
  ritter:   { name: 'Rabenritter', leben: 100, tempo: 4.3, schaden: [6, 6, 10], reichweite: 1.55, spezial: 'stein' },
  scherge:  { name: 'Scherge',  leben: 30,  tempo: 3.7, schaden: [4, 4, 6],    reichweite: 1.35, spezial: null },
  boss:     { name: 'Hauptmann', leben: 140, tempo: 3.9, schaden: [8, 8, 13], reichweite: 1.75, spezial: 'stein' },
};
const WELLEN = [['scherge', 'scherge'], ['scherge', 'scherge', 'scherge'], ['boss']];
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// Eine Runde. Eingaben je Kämpfer: mx, mz (Laufrichtung, Länge bis 1) und wunsch.angriff / .rolle / .spezial.
// Richtung r: Blick zeigt nach (sin r, cos r). Team 0 startet unten (z > 0), Team 1 oben.
class Kampf {
  constructor(seed, liste, opt = {}) {
    this.rnd = mulberry32(seed); this.zeit = 0; this.limit = opt.limit ?? K.RUNDE_ZEIT; this.ereignisse = []; this.fertig = false; this.sieger = -1;
    const zahl = [0, 0], von = [liste.filter(e => e.team === 0).length, liste.filter(e => e.team === 1).length];
    this.k = liste.map((e, i) => { const t = TYPEN[e.typ], j = zahl[e.team]++, n = von[e.team];
      return { i, typ: e.typ, team: e.team, x: (j - (n - 1) / 2) * 2.2, z: e.team === 0 ? 3.2 : -3.2, r: e.team === 0 ? Math.PI : 0, sx: 0, sz: 0,
        leben: e.leben ?? t.leben, maxLeben: t.leben, energie: e.energie ?? 0, zustand: 'frei', t: 0, kette: 0, traf: false, puffer: false, schlagNr: 0,
        rollePause: 0, schutz: 0, rx: 0, rz: 0, spezial: 0, mx: 0, mz: 0, wunsch: { angriff: false, rolle: false, spezial: false } }; });
  }
  lebend(team) { return this.k.filter(f => f.team === team && f.zustand !== 'tot'); }
  step() {
    this.ereignisse.length = 0; if (this.fertig) return; this.zeit += DT;
    for (const f of this.k) if (f.zustand !== 'tot') this.bewege(f);
    // Körper schieben sich auseinander (wer rollt, schlüpft durch)
    for (let a = 0; a < this.k.length; a++) for (let b = a + 1; b < this.k.length; b++) { const p = this.k[a], q = this.k[b];
      if (p.zustand === 'tot' || q.zustand === 'tot' || p.zustand === 'rolle' || q.zustand === 'rolle') continue;
      const dx = q.x - p.x, dz = q.z - p.z, d = Math.hypot(dx, dz), m = 2 * K.KOERPER;
      if (d < m) { const nx = d > 1e-4 ? dx / d : 1, nz = d > 1e-4 ? dz / d : 0, h = (m - d) / 2; p.x -= nx * h; p.z -= nz * h; q.x += nx * h; q.z += nz * h; } }
    for (const f of this.k) { const d = Math.hypot(f.x, f.z), max = K.ARENA_R - K.KOERPER; if (d > max) { f.x *= max / d; f.z *= max / d; f.sx *= 0.3; f.sz *= 0.3; } }
    const a = this.lebend(0).length, b = this.lebend(1).length;
    if (a === 0 || b === 0) { this.fertig = true; this.sieger = a > 0 ? 0 : b > 0 ? 1 : -1; }
    else if (this.zeit >= this.limit) { this.fertig = true; const teil = t => this.k.filter(f => f.team === t).reduce((s, f) => s + Math.max(0, f.leben) / f.maxLeben, 0) / this.k.filter(f => f.team === t).length;
      const u = teil(0), v = teil(1); this.sieger = Math.abs(u - v) < 0.01 ? -1 : u > v ? 0 : 1; this.ereignisse.push({ art: 'zeit' }); }
  }
  bewege(f) {
    const t = TYPEN[f.typ], w = f.wunsch;
    if (f.rollePause > 0) f.rollePause -= DT; if (f.schutz > 0) f.schutz -= DT;
    if (f.spezial > 0) { f.spezial -= DT; if (f.spezial <= 0) { f.spezial = 0; this.ereignisse.push({ art: 'spezialEnde', von: f.i }); } }
    const sturm = f.spezial > 0 && t.spezial === 'sturm', stein = f.spezial > 0 && t.spezial === 'stein';
    f.x += f.sx * DT; f.z += f.sz * DT; const ab = Math.exp(-DT * 9); f.sx *= ab; f.sz *= ab;   // Rückstoß klingt ab
    const ml = Math.hypot(f.mx, f.mz), ex = ml > 1 ? f.mx / ml : f.mx, ez = ml > 1 ? f.mz / ml : f.mz;
    if (f.zustand === 'taumel') { w.angriff = w.rolle = false; f.t -= DT; if (f.t <= 0) f.zustand = 'frei'; return; }
    if (f.zustand === 'rolle') { f.x += f.rx * K.ROLLE_TEMPO * DT; f.z += f.rz * K.ROLLE_TEMPO * DT; f.t -= DT; if (f.t <= 0) { f.zustand = 'frei'; f.rollePause = K.ROLLE_PAUSE; } return; }
    if (f.zustand === 'schlag') {
      const tempo = (sturm ? K.STURM_SCHLAG : stein ? 1.12 : 1) * (t.flink ?? 1), dauer = K.SCHLAG_ZEIT[f.kette] * tempo; f.t += DT;
      if (f.t < 0.12) { f.x += Math.sin(f.r) * 2.2 * DT; f.z += Math.cos(f.r) * 2.2 * DT; }      // kleiner Ausfallschritt
      if (!f.traf && f.t >= K.TREFFER_BEI * tempo) { f.traf = true; this.schlagTrifft(f); }
      if (w.angriff && f.t > 0.1) { f.puffer = true; w.angriff = false; }                        // nächsten Schlag vormerken
      if (w.rolle && f.traf && f.rollePause <= 0) { w.rolle = false; this.starteRolle(f, ex, ez, ml); return; }
      if (f.t >= dauer) { if (f.puffer && f.kette < 2) this.starteSchlag(f, f.kette + 1, ex, ez, ml); else { f.zustand = 'frei'; f.kette = 0; } }
      return;
    }
    // frei: laufen und Wünsche annehmen
    const v = t.tempo * (sturm ? K.STURM_TEMPO : stein ? K.STEIN_TEMPO : 1); f.x += ex * v * DT; f.z += ez * v * DT;
    if (ml > 0.1) { let d = Math.atan2(ex, ez) - f.r; d = Math.atan2(Math.sin(d), Math.cos(d)); f.r += Math.max(-K.DREH * DT, Math.min(K.DREH * DT, d)); }
    if (w.spezial) { w.spezial = false; if (f.energie >= 100 && t.spezial) { f.energie = 0; f.spezial = K.SPEZIAL_DAUER; this.ereignisse.push({ art: 'spezial', von: f.i, x: f.x, z: f.z, sorte: t.spezial }); } }
    if (w.rolle) { w.rolle = false; if (f.rollePause <= 0) { this.starteRolle(f, ex, ez, ml); return; } }
    if (w.angriff) { w.angriff = false; this.starteSchlag(f, 0, ex, ez, ml); }
  }
  starteRolle(f, ex, ez, ml) { if (ml > 0.2) { f.rx = ex / ml; f.rz = ez / ml; f.r = Math.atan2(ex, ez); } else { f.rx = Math.sin(f.r); f.rz = Math.cos(f.r); }
    f.zustand = 'rolle'; f.t = K.ROLLE_ZEIT; f.kette = 0; this.ereignisse.push({ art: 'rolle', von: f.i, x: f.x, z: f.z }); }
  starteSchlag(f, kette, ex, ez, ml) {
    let rx = Math.sin(f.r), rz = Math.cos(f.r); if (ml > 0.05) { rx = ex / ml; rz = ez / ml; }
    // Zielhilfe: Ein Gegner direkt daneben oder ungefähr in Schlagrichtung wird genau anvisiert
    let best = null, bd = K.ZIELHILFE;
    for (const g of this.k) { if (g.team === f.team || g.zustand === 'tot') continue; const dx = g.x - f.x, dz = g.z - f.z, d = Math.hypot(dx, dz);
      if (d < bd && (d < 2 || (dx * rx + dz * rz) / d > 0.25)) { bd = d; best = g; } }
    if (best) { rx = best.x - f.x; rz = best.z - f.z; }
    f.r = Math.atan2(rx, rz); f.zustand = 'schlag'; f.t = 0; f.kette = kette; f.traf = false; f.puffer = false; f.schlagNr++;
    this.ereignisse.push({ art: 'schlag', von: f.i, kette });
  }
  schlagTrifft(f) {
    const t = TYPEN[f.typ], stein = f.spezial > 0 && t.spezial === 'stein', sturm = f.spezial > 0 && t.spezial === 'sturm';
    const rx = Math.sin(f.r), rz = Math.cos(f.r), weit = t.reichweite * (stein ? 1.25 : 1) + K.KOERPER;
    for (const g of this.k) { if (g.team === f.team || g.zustand === 'tot' || g.zustand === 'rolle' || g.schutz > 0) continue;
      const dx = g.x - f.x, dz = g.z - f.z, d = Math.hypot(dx, dz); if (d > weit) continue;
      if (d > 0.5 && (dx * rx + dz * rz) / d < (sturm ? -0.2 : K.WINKEL)) continue;
      const schaden = Math.round(t.schaden[f.kette] * (stein ? K.STEIN : sturm ? K.STURM : 1));
      g.leben -= schaden; if (f.spezial <= 0) f.energie = Math.min(100, f.energie + K.E_AUSTEILEN); if (g.spezial <= 0) g.energie = Math.min(100, g.energie + K.E_EINSTECKEN);
      // Wer verwandelt ist, taumelt nicht; nur der Steinriese lässt sich auch kaum wegstoßen
      const fest = g.spezial > 0, schwer = fest && TYPEN[g.typ].spezial === 'stein', nx = d > 1e-4 ? dx / d : rx, nz = d > 1e-4 ? dz / d : rz, stoss = K.RUECK[f.kette] * (stein ? 1.3 : 1) * (schwer ? 0.2 : 1);
      g.sx = nx * stoss; g.sz = nz * stoss;
      if (g.leben <= 0) { g.leben = 0; g.zustand = 'tot'; g.sx *= 1.4; g.sz *= 1.4; this.ereignisse.push({ art: 'ko', von: f.i, auf: g.i, x: g.x, z: g.z }); }
      else if (!fest) { g.zustand = 'taumel'; g.t = K.TAUMEL[f.kette]; g.kette = 0; if (f.kette === 2) g.schutz = K.TAUMEL[2] + K.SCHUTZ; }
      this.ereignisse.push({ art: 'treffer', von: f.i, auf: g.i, schaden, x: g.x, z: g.z, stark: f.kette === 2 || stein });
    }
  }
}

let ac = null;

    o.type = art; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, ziel), t + dauer); g.gain.setValueAtTime(laut, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dauer); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dauer); } catch (e) {} }
const vib = m => { if (stand.vib && navigator.vibrate) try { navigator.vibrate(m); } catch (e) {} };
let wackel = 0, stopp = 0, zeitlupe = 0, bannerUhr = 0;
function banner(text, klein = '', ms = 1300) { const el = $('banner'); el.innerHTML = text + (klein ? `<small>${klein}</small>` : ''); el.classList.add('an'); clearTimeout(bannerUhr); bannerUhr = setTimeout(() => el.classList.remove('an'), ms); }
function fx(e) { // Ereignisse aus der Simulation ⇒ Bild, Ton, Vibration
  const k = app.match.kampf;
  if (e.art === 'schlag') { bogen(k.k[e.von], e.kette); ton(e.kette === 2 ? 190 : 260, 0.09, 'triangle', 0.05, 90); }
  else if (e.art === 'treffer') { const ich = e.auf === 0; funken(e.x, 1.1, e.z, e.stark ? 0xffd27a : 0xffe8c0, e.stark ? 14 : 8, e.stark ? 4.5 : 3); app.figuren[e.auf].blitz = 1;
    zahl(e.x, e.z, e.schaden, (e.stark ? 'gross ' : '') + (ich ? 'ich' : '')); wackel = Math.max(wackel, e.stark ? 0.32 : 0.14); stopp = Math.max(stopp, e.stark ? 0.09 : 0.045);
    ton(e.stark ? 110 : 150, e.stark ? 0.2 : 0.12, 'sawtooth', e.stark ? 0.13 : 0.09, 40); if (ich) vib(e.stark ? 60 : 25); }
  else if (e.art === 'ko') { zeitlupe = 0.9; wackel = 0.45; funken(e.x, 1, e.z, 0xff9050, 22, 6); ton(90, 0.5, 'sawtooth', 0.14, 30); vib(e.auf === 0 ? [80, 40, 120] : 50); }
  else if (e.art === 'rolle') { funken(e.x, 0.2, e.z, 0xd8c8a8, 5, 1.5); ton(420, 0.1, 'sine', 0.04, 200); }
  else if (e.art === 'spezial') { funken(e.x, 1, e.z, e.sorte === 'stein' ? 0xffc070 : 0x9fe8ff, 30, 6); wackel = 0.35; stopp = 0.12; ton(220, 0.5, 'square', 0.1, 880); if (e.von === 0) { vib([40, 30, 80]); banner(e.sorte === 'stein' ? 'Steinriese!' : 'Sturm!', '', 800); } }
  else if (e.art === 'los') { banner('Los!', '', 600); ton(660, 0.25, 'square', 0.08, 990); }
  else if (e.art === 'zeit') banner('Zeit um!', '', 1000);
  else if (e.art === 'rundeEnde') { const m = app.match; if (m.gewonnen === null) banner(m.opt.modus === 'wellen' ? `Welle ${m.welle} geschafft!` : e.sieger === 0 ? 'Runde gewonnen!' : e.sieger === 1 ? 'Runde verloren' : 'Unentschieden', '', 1500); }
  else if (e.art === 'ende') zeigeErgebnis(e.gewonnen);
}

// ---------- Kamera: behält dich und den nächsten Gegner im Bild ----------
const kam = { x: 0, z: 1, d: 16 };
function bewegeKamera(dt, hart) {
  let zx = 0, zz = 0, weite = 9;
  const k = app.match?.kampf; if (k) { const ich = k.k[0]; let nah = null, nd = 1e9; for (const g of k.k) if (g.team === 1 && g.zustand !== 'tot') { const d = Math.hypot(g.x - ich.x, g.z - ich.z); if (d < nd) { nd = d; nah = g; } }
    if (nah) { zx = lerp(ich.x, nah.x, 0.4); zz = lerp(ich.z, nah.z, 0.4); weite = klemme(nd * 1.2 + 4.2, 6, 12); } else { zx = ich.x * 0.7; zz = ich.z * 0.7; } }
  const hoch = innerHeight > innerWidth, ziel = weite * (hoch ? 1.5 : 1.0), a = hart ? 1 : 1 - Math.exp(-dt * 4);
  kam.x = lerp(kam.x, zx, a); kam.z = lerp(kam.z, zz, a); kam.d = lerp(kam.d, ziel, hart ? 1 : 1 - Math.exp(-dt * 2.5));
  const wx = wackel > 0 ? (Math.random() - 0.5) * wackel : 0, wz = wackel > 0 ? (Math.random() - 0.5) * wackel : 0; wackel = Math.max(0, wackel - dt * 1.6);
  camera.position.set(kam.x + wx, kam.d * 0.74, kam.z + kam.d * 0.68 + wz); camera.lookAt(kam.x + wx, 0.7, kam.z + wz - 0.2);
  sonne.target.position.set(kam.x, 0, kam.z); sonne.position.set(kam.x + 7, 12, kam.z + 5); sonne.target.updateMatrixWorld();
}

// ---------- Bedienung ----------
// Links: schwebender Steuerkreis auf dem Spielfeld, der zuletzt aufgesetzte Finger lenkt. Rechts: drei Knöpfe.
// Loslassen wird an Canvas und Fenster abgefangen (dazu blur und visibilitychange), damit nichts hängen bleibt.
const JOY_R = 58, JOY_TOT = 8;
const eingabe = { joy: null, tasten: new Set(), halten: false };
const kreisEl = $('kreis'), knaufEl = $('knauf');
function zeigeKreis() { const j = eingabe.joy; kreisEl.style.display = knaufEl.style.display = j ? 'block' : 'none'; if (!j) return;
  kreisEl.style.left = j.x0 + 'px'; kreisEl.style.top = j.y0 + 'px'; knaufEl.style.left = j.x + 'px'; knaufEl.style.top = j.y + 'px'; }
canvas.addEventListener('pointerdown', e => { if (!app.läuft) return; try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  eingabe.joy = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY }; zeigeKreis(); });
canvas.addEventListener('pointermove', e => { const j = eingabe.joy; if (!j || e.pointerId !== j.id) return; j.x = e.clientX; j.y = e.clientY;
  const dx = j.x - j.x0, dy = j.y - j.y0, d = Math.hypot(dx, dy); if (d > JOY_R) { j.x0 += dx * (1 - JOY_R / d); j.y0 += dy * (1 - JOY_R / d); } zeigeKreis(); });
function los(e) { const j = eingabe.joy; if (!j || (e && e.pointerId !== j.id)) return; eingabe.joy = null; zeigeKreis(); }
for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) { canvas.addEventListener(t, los); window.addEventListener(t, los); }
function allesLos() { los(); eingabe.tasten.clear(); eingabe.halten = false; document.querySelectorAll('.kn').forEach(k => k.classList.remove('gedrückt')); }
window.addEventListener('blur', allesLos); document.addEventListener('visibilitychange', allesLos);
const wunsch = was => { const f = app.match?.kampf.k[0]; if (f && app.läuft && app.match.opt.mensch) f.wunsch[was] = true; };
for (const [id, was] of [['kAngriff', 'angriff'], ['kRolle', 'rolle'], ['kSpezial', 'spezial']]) { const el = $(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('gedrückt'); wunsch(was); if (was === 'angriff') eingabe.halten = true; });
  for (const t of ['pointerup', 'pointercancel', 'pointerleave']) el.addEventListener(t, () => { el.classList.remove('gedrückt'); if (was === 'angriff') eingabe.halten = false; }); }
window.addEventListener('keydown', e => { if (e.repeat) return; eingabe.tasten.add(e.code);
  if (e.code === 'KeyJ' || e.code === 'Space') wunsch('angriff'); if (e.code === 'KeyK' || e.code === 'ShiftLeft') wunsch('rolle'); if (e.code === 'KeyL' || e.code === 'KeyE') wunsch('spezial'); });
window.addEventListener('keyup', e => eingabe.tasten.delete(e.code));
canvas.addEventListener('contextmenu', e => e.preventDefault());
function leseEingabe() { // Steuerkreis und Tasten → Laufrichtung des Spielers (oben im Bild = von der Kamera weg = −z)
  const f = app.match.kampf.k[0]; if (!app.match.opt.mensch) return; let x = 0, z = 0; const t = eingabe.tasten, j = eingabe.joy;
  if (j) { const dx = j.x - j.x0, dy = j.y - j.y0, d = Math.hypot(dx, dy); if (d > JOY_TOT) { const s = Math.min(1, (d - JOY_TOT) / (JOY_R - JOY_TOT)); x = dx / d * s; z = dy / d * s; } }
  if (t.has('KeyW') || t.has('ArrowUp')) z -= 1; if (t.has('KeyS') || t.has('ArrowDown')) z += 1; if (t.has('KeyA') || t.has('ArrowLeft')) x -= 1; if (t.has('KeyD') || t.has('ArrowRight')) x += 1;
  const l = Math.hypot(x, z); if (l > 1) { x /= l; z /= l; } f.mx = x; f.mz = z;
  if (eingabe.halten && f.zustand === 'schlag' && f.t > 0.12) f.wunsch.angriff = true;      // Knopf halten = Schlagfolge
}

// ---------- Anzeige ----------
function zeigeAnzeige() {
  const m = app.match, k = m.kampf, ich = k.k[0], gegner = k.k.filter(f => f.team === 1), o = m.opt;
  $('lebenIch').style.transform = `scaleX(${Math.max(0, ich.leben) / ich.maxLeben})`;
  const le = gegner.reduce((s, f) => s + Math.max(0, f.leben), 0), lm = gegner.reduce((s, f) => s + f.maxLeben, 0); $('lebenGegner').style.transform = `scaleX(${le / lm})`;
  const kI = $('kraftIch'), kG = $('kraftGegner'); kI.firstChild.style.transform = `scaleX(${ich.spezial > 0 ? ich.spezial / K.SPEZIAL_DAUER : ich.energie / 100})`; kI.classList.toggle('voll', ich.energie >= 100 || ich.spezial > 0);
  const g0 = gegner[0]; kG.style.visibility = TYPEN[g0.typ].spezial ? 'visible' : 'hidden'; kG.firstChild.style.transform = `scaleX(${g0.spezial > 0 ? g0.spezial / K.SPEZIAL_DAUER : g0.energie / 100})`; kG.classList.toggle('voll', g0.energie >= 100 || g0.spezial > 0);
  $('uhr').textContent = m.phase === 'count' ? Math.ceil(m.t / (K.ZAEHLEN / 3)) : Math.max(0, Math.ceil(k.limit - k.zeit));
  $('punkte').textContent = o.modus === 'wellen' ? `Welle ${Math.min(m.welle + 1, WELLEN.length)}/${WELLEN.length}` : '●'.repeat(m.punkte[0]) + '○'.repeat(K.SIEGE - m.punkte[0]) + ' ' + '○'.repeat(K.SIEGE - m.punkte[1]) + '●'.repeat(m.punkte[1]);
  $('nameGegner').textContent = o.modus === 'wellen' ? (gegner.length > 1 ? `${gegner.filter(f => f.zustand !== 'tot').length} Schergen` : TYPEN[g0.typ].name) : `${TYPEN[g0.typ].name} · Stufe ${o.stufe}`;
  $('kSpezial').classList.toggle('voll', ich.energie >= 100); $('kRolle').classList.toggle('pause', ich.rollePause > 0);
}

// ---------- Spielablauf ----------
const app = { läuft: false, match: null, figuren: [], kampfAlt: null, tempo: +(Q.get('tempo') || 1), rest: 0 };
let zeit = 0;
function starte(opt = {}) {
  for (const f of app.figuren) scene.remove(f.grp); app.figuren = []; app.kampfAlt = null;
  app.match = new Match({ modus: stand.modus, spieler: stand.char, gegner: stand.char === 'junge' ? 'ritter' : 'ritter', stufe: stand.stufe, seed: (Date.now() & 0x7fffffff) || 1, mensch: !Q.has('auto'), ...opt });
  app.läuft = true; app.rest = 0; zeitlupe = 0; stopp = 0;
  $('menü').classList.remove('an'); $('ergebnis').classList.remove('an'); $('anzeige').style.display = 'grid'; $('knöpfe').style.display = 'block';
  $('nameIch').textContent = TYPEN[app.match.opt.spieler].name; bewegeKamera(0, true);
}
function zeigeErgebnis(gewonnen) {
  const o = app.match.opt; app.läuft = false; allesLos(); $('knöpfe').style.display = 'none';
  let text = ''; if (o.modus === 'duell') { if (gewonnen && stand.stufe < 10 && o.stufe === stand.stufe) { stand.stufe++; speicher.schreib('stufe', stand.stufe); text = `Der nächste Gegner kämpft auf Stufe ${stand.stufe}.`; }
      else text = gewonnen ? 'Stärker wird der Computer nicht mehr.' : 'Tipp: Weiche aus, wenn der Gegner ausholt, und schlage direkt danach zu.'; }
  else text = gewonnen ? 'Alle drei Wellen überstanden.' : `Du bist in Welle ${app.match.welle + 1} gescheitert.`;
  $('ergTitel').textContent = gewonnen ? 'Sieg!' : 'Niederlage'; $('ergText').textContent = text; if (gewonnen) { ton(523, 0.15); setTimeout(() => ton(784, 0.3), 150); vib([60, 40, 60, 40, 140]); }
  setTimeout(() => $('ergebnis').classList.add('an'), 500);
}
function zumMenü() { app.läuft = false; $('ergebnis').classList.remove('an'); $('anzeige').style.display = 'none'; $('knöpfe').style.display = 'none'; zeichneMenü(); $('menü').classList.add('an'); }
function zeichneMenü() {
  const c = $('wahlChar'); c.innerHTML = ''; for (const typ of ['junge', 'maedchen']) { const b = document.createElement('button'); b.className = 'wahl' + (stand.char === typ ? ' an' : ''); b.dataset.char = typ;
    b.innerHTML = `${TYPEN[typ].name}<small>${TYPEN[typ].spezial === 'stein' ? 'wird zum Steinriesen' : 'entfesselt den Sturm'}</small>`; b.addEventListener('click', () => { stand.char = typ; speicher.schreib('char', typ); zeichneMenü(); }); c.appendChild(b); }
  document.querySelectorAll('#wahlModus .wahl').forEach(b => b.classList.toggle('an', b.dataset.modus === stand.modus));
  $('stufeText').textContent = `Computer-Gegner: Stufe ${stand.stufe} von 10`; $('sTon').textContent = 'Ton: ' + (stand.ton ? 'an' : 'aus'); $('sVib').textContent = 'Vibration: ' + (stand.vib ? 'an' : 'aus');
}
document.querySelectorAll('#wahlModus .wahl').forEach(b => b.addEventListener('click', () => { stand.modus = b.dataset.modus; speicher.schreib('modus', stand.modus); zeichneMenü(); }));
$('sTon').addEventListener('click', () => { stand.ton = !stand.ton; speicher.schreib('ton', stand.ton ? '1' : '0'); zeichneMenü(); });
$('sVib').addEventListener('click', () => { stand.vib = !stand.vib; speicher.schreib('vib', stand.vib ? '1' : '0'); zeichneMenü(); });
$('los').addEventListener('click', () => starte()); $('nochmal').addEventListener('click', () => starte()); $('zumMenü').addEventListener('click', zumMenü);

// ---------- Hauptschleife ----------
const uhr = new THREE.Clock();
function passeAn() { renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = innerHeight > innerWidth ? 40 : 46; camera.updateProjectionMatrix(); }
window.addEventListener('resize', passeAn);
function bild() {
  requestAnimationFrame(bild); const echt = Math.min(0.05, uhr.getDelta()); zeit += echt;
  let dt = echt; if (zeitlupe > 0) { zeitlupe -= echt; dt *= 0.3; } if (stopp > 0) { stopp -= echt; dt = 0; }      // Treffer-Stopp und Zeitlupe sind nur Darstellung
  const m = app.match;
  if (m && m.phase !== 'over') { app.rest += dt * app.tempo; let n = 0;
    while (app.rest >= DT && n++ < 40) { app.rest -= DT; if (m.phase === 'play') leseEingabe(); m.tick(); for (const e of m.ereignisse) fx(e); if (stopp > 0 || m.phase === 'over') break; } }
  if (m) { const k = m.kampf; if (k !== app.kampfAlt) { for (const f of app.figuren) scene.remove(f.grp); app.figuren = k.k.map(baueFigur); app.kampfAlt = k; }
    k.k.forEach((f, i) => zeigeFigur(app.figuren[i], f, dt)); zeigeAnzeige(); }
  bewegeTeile(dt); for (const f of feuer) { f.scale.setScalar(1.5 + 0.25 * Math.sin(zeit * 9 + f.userData.ph) + 0.15 * Math.sin(zeit * 23 + f.userData.ph)); }
  bewegeKamera(echt, false); renderer.render(scene, camera);
}

async function init() {
  passeAn(); baueArena(); zeichneMenü(); await ladeVorlagen();
  // Im Menü läuft im Hintergrund ein Schaukampf Computer gegen Computer
  app.match = new Match({ modus: 'duell', spieler: 'junge', gegner: 'ritter', stufe: 4, spielerStufe: 4, mensch: false, seed: 77 }); bewegeKamera(0, true);
  renderer.compile(scene, camera); requestAnimationFrame(bild);
  $('meldung').textContent = fehlend.length ? 'Figuren nicht geladen, es geht mit Ersatzfiguren weiter.' : 'Die Figuren sind Platzhalter, bis deine eigenen da sind.'; $('los').style.display = 'inline-block';
  AR.bereit = true; if (Q.has('start')) starte({ ...(Q.get('modus') ? { modus: Q.get('modus') } : {}), ...(Q.get('stufe') ? { stufe: +Q.get('stufe') } : {}), ...(Q.get('seed') ? { seed: +Q.get('seed') } : {}), ...(Q.get('spielerStufe') ? { spielerStufe: +Q.get('spielerStufe') } : {}) });
}
const AR = window.AR = { bereit: false, K, TYPEN, WELLEN, Kampf, Bot, Match, app, stand, eingabe, fehlend, starte, zumMenü,
  info: () => { const m = app.match, k = m.kampf, ich = k.k[0], g = k.k.filter(f => f.team === 1);
    return { läuft: app.läuft, phase: m.phase, modus: m.opt.modus, punkte: [...m.punkte], welle: m.welle, gewonnen: m.gewonnen, zeit: k.zeit,
      ich: { x: ich.x, z: ich.z, leben: ich.leben, energie: ich.energie, zustand: ich.zustand, spezial: ich.spezial, kette: ich.kette }, gegner: g.map(f => ({ x: f.x, z: f.z, leben: f.leben, zustand: f.zustand })) }; } };
init().catch(e => { console.error(e); $('meldung').textContent = 'Fehler beim Start: ' + e.message; });
</script>
