<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16242e">
<title>Vikings – Anführer ansehen</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16242e; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; border: 0; }
  #oben { position: fixed; left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top)); pointer-events: none; text-shadow: 0 1px 4px #000; }
  #oben b { display: block; font-size: 18px; } #mess { font-size: 13px; color: #dbe6ee; line-height: 1.4; }
  .reihe { position: fixed; left: 8px; right: 8px; display: flex; gap: 7px; justify-content: center; }
  #ansichten { bottom: calc(86px + env(safe-area-inset-bottom)); } #fassungen { bottom: calc(10px + env(safe-area-inset-bottom)); }
  #bewegungen { bottom: calc(150px + env(safe-area-inset-bottom)); gap: 5px; } #bewegungen button { padding: 7px 2px; font-size: 11.5px; border-radius: 10px; }
  .reihe button { flex: 1; max-width: 130px; border-radius: 12px; padding: 9px 4px; font-size: 13px; font-weight: 700; background: rgba(22,32,42,.88);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.18); }
  .reihe button small { display: block; font-weight: 400; font-size: 11px; color: #c9d6e0; }
  .reihe button.an { background: rgba(255,210,122,.3); box-shadow: inset 0 0 0 3px #ffd27a; }
  #lade { position: fixed; left: 0; right: 0; top: 45%; text-align: center; font-size: 16px; font-weight: 700; text-shadow: 0 2px 6px #000; pointer-events: none; }
</style>
</head>
<body>
<canvas id="bild"></canvas>
<div id="oben"><b>Anführer – welche Fassung?</b><span id="mess"></span></div>
<div id="lade">Lädt …</div>
<div class="reihe" id="bewegungen" style="display:none"></div>
<div class="reihe" id="ansichten">
  <button data-a="ganz">Ganze Figur</button>
  <button data-a="nah">Ganz nah</button>
  <button data-a="raubzug">Wie im Raubzug<small>18 Figuren</small></button>
</div>
<div class="reihe" id="fassungen">
  <button data-f="80k">Fein<small>80.000 Flächen</small></button>
  <button data-f="250k">Sehr fein<small>250.000 Flächen</small></button>
  <button data-f="600k">Am feinsten<small>600.000 Flächen</small></button>
</div>

<script type="importmap">{ "imports": { "three": "../lib/three.module.min.js", "three/addons/": "../lib/jsm/" } }</script>
<script type="module">
// Ansichts-Seite: dieselbe Figur in drei Feinheiten, damit der User am Handy entscheiden kann.
// Hat die Datei ein Skelett mit Bewegungen (aus Mixamo), spielt die Seite sie ab; eine Leiste wählt die Bewegung.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { clone as kloneSkelett } from 'three/addons/utils/SkeletonUtils.js';
import { umgebung } from './js/licht.js';

const Q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const FASSUNGEN = { '80k': 'modelle/anfuehrer-80k.glb', '250k': 'modelle/anfuehrer-250k.glb', '600k': 'modelle/anfuehrer-600k.glb' };
const HOEHE = 1.85, DREH = +(Q.get('dreh') ?? 0);            // DREH: Vorderseite zur Kamera
// Zum Prüfen lässt sich jede GLB-Datei dieses Ordners ansehen: ?datei=modelle/irgendwas.glb
if (/^[\w\-./]+\.glb$/.test(Q.get('datei') ?? '') && !Q.get('datei').includes('..')) FASSUNGEN.datei = Q.get('datei');
const zustand = { fassung: FASSUNGEN.datei ? 'datei' : FASSUNGEN[Q.get('fassung')] ? Q.get('fassung') : '250k', ansicht: ['ganz', 'nah', 'raubzug'].includes(Q.get('ansicht')) ? Q.get('ansicht') : 'ganz',
  winkel: 0, ruhe: 0, bilder: 0, dreiecke: 0, mb: 0, ladezeit: 0, bewegung: Q.get('bewegung') || 'steh', bewegungen: [] };
const BEWEGUNG = { steh: 'Stehen', lauf: 'Laufen', schlag1: 'Hieb oben', schlag2: 'Hieb seitlich', schrei: 'Schrei', tod: 'Fallen' };

const canvas = $('bild'), renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b2630);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);

scene.environment = umgebung(renderer); scene.environmentIntensity = 0.9;   // Glanz für Leder, Fell und Metall (js/licht.js)
const sonne = new THREE.DirectionalLight(0xffe2b8, 2.2); sonne.position.set(-3.5, 6, 5); sonne.castShadow = true; sonne.shadow.mapSize.set(2048, 2048);
Object.assign(sonne.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 0.5, far: 30 }); sonne.shadow.bias = -0.0004; sonne.shadow.normalBias = 0.02; scene.add(sonne);
const boden = new THREE.Mesh(new THREE.CircleGeometry(40, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x4d6a3c, roughness: 1, metalness: 0 })); boden.receiveShadow = true; scene.add(boden);

const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const geladen = {}, gruppe = new THREE.Group(), mixer = []; scene.add(gruppe);
async function lade(f) {
  if (geladen[f]) return geladen[f];
  const t0 = performance.now(), antwort = await fetch(FASSUNGEN[f]); if (!antwort.ok) throw new Error('Datei fehlt: ' + FASSUNGEN[f]);
  const daten = await antwort.arrayBuffer(), g = await loader.parseAsync(daten, new URL('modelle/', location.href).href);
  const box = new THREE.Box3().setFromObject(g.scene), halter = new THREE.Group(); let dreiecke = 0;
  g.scene.position.set(-(box.min.x + box.max.x) / 2, -box.min.y, -(box.min.z + box.max.z) / 2); halter.add(g.scene); halter.scale.setScalar(HOEHE / (box.max.y - box.min.y));
  g.scene.traverse(o => { if (!o.isMesh) return; o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; dreiecke += o.geometry.index.count / 3;
    for (const k of ['map', 'normalMap', 'roughnessMap', 'metalnessMap']) if (o.material[k]) o.material[k].anisotropy = 8; });
  return geladen[f] = { halter, dreiecke, clips: g.animations, mb: daten.byteLength / 1048576, ladezeit: (performance.now() - t0) / 1000 };
}
async function zeige(f) {
  zustand.fassung = f; $('lade').textContent = 'Lädt …'; for (const b of document.querySelectorAll('[data-f]')) b.classList.toggle('an', b.dataset.f === f);
  let v; try { v = await lade(f); } catch (e) { $('lade').textContent = e.message; return; }
  if (zustand.fassung !== f) return;                      // inzwischen wurde eine andere gewählt
  Object.assign(zustand, { dreiecke: v.dreiecke, mb: v.mb, ladezeit: v.ladezeit }); stelleAuf(); $('lade').textContent = ''; VF.bereit = true;
}
function stelleAuf() { // eine Figur oder 18 wie auf dem Schlachtfeld
  gruppe.clear(); const v = geladen[zustand.fassung]; if (!v) return;
  const n = zustand.ansicht === 'raubzug' ? 18 : 1;
  zustand.bewegungen = v.clips.map(c => c.name); const clip = v.clips.find(c => c.name === zustand.bewegung) ?? v.clips[0]; if (clip) zustand.bewegung = clip.name;
  mixer.length = 0;
  for (let i = 0; i < n; i++) { const k = i === 0 ? v.halter : v.clips.length ? kloneSkelett(v.halter) : v.halter.clone();
    k.position.set(n === 1 ? 0 : (i % 6 - 2.5) * 1.7, 0, n === 1 ? 0 : (Math.floor(i / 6) - 1) * 2.2); k.userData.versatz = i * 0.7; gruppe.add(k);
    if (clip) { const mx = new THREE.AnimationMixer(k), a = mx.clipAction(clip); a.play(); a.time = (i * 0.7) % clip.duration; mixer.push(mx);
      if (Q.has('zeit')) { a.time = Math.min(+Q.get('zeit'), clip.duration - 0.001); a.paused = true; } } }   // ?zeit= hält die Bewegung an einer Stelle an (zum Prüfen)
  // Leiste mit den Bewegungen, sobald es mehr als eine gibt
  const leiste = $('bewegungen'); leiste.innerHTML = ''; leiste.style.display = v.clips.length > 1 ? 'flex' : 'none';
  for (const c of v.clips) { const b = document.createElement('button'); b.textContent = BEWEGUNG[c.name] ?? c.name; b.dataset.b = c.name; b.classList.toggle('an', c.name === zustand.bewegung);
    b.addEventListener('click', () => { zustand.bewegung = c.name; stelleAuf(); }); leiste.appendChild(b); }
  for (const b of document.querySelectorAll('[data-a]')) b.classList.toggle('an', b.dataset.a === zustand.ansicht);
  mt = 0; mn = 0; zustand.bilder = 0; zeigeMessung(); setzeKamera();   // nach jedem Wechsel neu messen
}
function setzeKamera() {
  const w = innerWidth, h = innerHeight; renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  const t = Math.tan(camera.fov * Math.PI / 360);
  if (zustand.ansicht === 'nah') { camera.position.set(0, 1.62, 1.45); camera.lookAt(0, 1.5, 0); }
  else if (zustand.ansicht === 'raubzug') { const d = 18 / (2 * t * camera.aspect), n = 61 * Math.PI / 180; camera.position.set(0, d * Math.sin(n), d * Math.cos(n)); camera.lookAt(0, 0, 0); }
  else { const d = Math.max(HOEHE / 0.54 / (2 * t), 1.5 / (2 * t * camera.aspect)); camera.position.set(0, 1.0, d); camera.lookAt(0, 0.62, 0); }   // etwas nach oben gerückt, unten liegen die Knöpfe
}
window.addEventListener('resize', setzeKamera);
for (const b of document.querySelectorAll('[data-f]')) b.addEventListener('click', () => zeige(b.dataset.f));
for (const b of document.querySelectorAll('[data-a]')) b.addEventListener('click', () => { zustand.ansicht = b.dataset.a; stelleAuf(); });

// Mit dem Finger drehen; lässt man los, dreht sich die Figur nach kurzer Pause wieder von selbst
let zieh = null;
canvas.addEventListener('pointerdown', e => { zieh = { id: e.pointerId, x: e.clientX }; try { canvas.setPointerCapture(e.pointerId); } catch (_) {} });
canvas.addEventListener('pointermove', e => { if (zieh && zieh.id === e.pointerId) { zustand.winkel += (e.clientX - zieh.x) * 0.012; zieh.x = e.clientX; zustand.ruhe = 2.5; } });
for (const t of ['pointerup', 'pointercancel']) canvas.addEventListener(t, () => { zieh = null; });

const uhr = new THREE.Clock(); let mt = 0, mn = 0;
function bild() {
  requestAnimationFrame(bild); const dt = Math.min(0.1, uhr.getDelta());
  zustand.ruhe = Math.max(0, zustand.ruhe - dt); if (!zieh && zustand.ruhe === 0 && !Q.has('still')) zustand.winkel += dt * 0.5;
  for (const k of gruppe.children) k.rotation.y = DREH + zustand.winkel + (zustand.ansicht === 'raubzug' ? k.userData.versatz : 0);
  for (const mx of mixer) mx.update(dt);
  renderer.render(scene, camera);
  mt += dt; mn++; if (mt >= 1) { zustand.bilder = Math.round(mn / mt); mt = 0; mn = 0; zeigeMessung(); }
}
function zeigeMessung() { const n = gruppe.children.length;
  $('mess').innerHTML = (zustand.bilder ? `${zustand.bilder} Bilder pro Sekunde` : 'misst …') + (n ? `<br>Datei ${zustand.mb.toFixed(1)} MB · geladen in ${zustand.ladezeit.toFixed(1)} s · ${Math.round(zustand.dreiecke * n / 1000).toLocaleString('de')} Tsd. Flächen im Bild` : ''); }
const VF = window.VF = { bereit: false, zustand, zeige, info: () => ({ ...zustand, figuren: gruppe.children.length, mixer: mixer.length, imBild: renderer.info.render.triangles }) };
setzeKamera(); requestAnimationFrame(bild); zeige(zustand.fassung);
</script>
</body>
</html>
